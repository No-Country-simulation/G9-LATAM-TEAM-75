spring.application.name=EnergiAI

# Puerto en el que escucha el backend. Railway (y la mayoría de los
# hosts en la nube) asignan el puerto dinámicamente vía la variable de
# entorno PORT; en local, sin esa variable, se usa 8080 como siempre.
server.port=${PORT:8080}

# URL del microservicio de clasificación del equipo de Data (POST, recibe el
# mismo JSON que /analisis-energetico y responde {categoria, probabilidad,
# recomendaciones}). Mientras esté vacía, o si falla la llamada, el backend
# usa un mock local en su lugar. También se puede setear con la variable de
# entorno DATA_MODELO_URL en vez de tocar este archivo.
data.modelo.url=https://visible-craftsman-filtrate.ngrok-free.dev/predecir

# Origen(es) permitidos para CORS (separados por coma si hay más de uno).
# En desarrollo local, http://localhost:4200 (donde corre "ng serve").
# Al desplegar (ej. Railway), se sobreescribe con la variable de entorno
# CORS_ALLOWED_ORIGIN a la URL real del frontend publicado.
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}

# Atributos de la cookie de sesión (identifica el historial de cada
# usuario, ver HistorialSesion.java). En desarrollo local, frontend y
# backend son "el mismo sitio" para el navegador (mismo dominio
# "localhost", solo cambia el puerto), así que la cookie viaja sin
# configuración extra. Al desplegar en dominios de verdad DISTINTOS
# (ej. frontend y backend en subdominios distintos de Railway), el
# navegador solo manda cookies "cross-site" si son SameSite=None y
# Secure (que exige HTTPS) — por eso estas dos se sobreescriben con
# variables de entorno solo en producción (COOKIE_SAME_SITE=none,
# COOKIE_SECURE=true), y en local quedan en sus valores por defecto.
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
